<body>

    <header>

    <div class="content">
        <h2>حافظِ ملت کی سیرت</h2>

        <p>

        </p>

        <button onclick="startStudy()">مطالعہ شروع کریں</button>
<br><br>

<button onclick="showBiography()">حافظِ ملت کی سیرت</button>

<div id="newContent"></div>

    <script>
        function showMessage() {
            document.getElementById("message").innerText =
                "حیاتِ حافظِ ملت ایپ میں خوش آمدید!";
        }function startStudy() {
    document.getElementById("newContent").innerHTML = `
        <h2>مطالعہ شروع کریں</h2>
        <h3>हाफ़िज़-ए-मिल्लत की किताब पढ़ें</h3>
        <p>नीचे दिए गए बटन से किताब पढ़ना शुरू करें।</p>
        <button onclick="showBook()">किताब खोलें</button>
    `;
}
       function showBiography() {
    document.getElementById("newContent").innerHTML = `
        <h2>حافظِ ملت کی سیرت</h2>
        <h3>हाफ़िज़-ए-मिल्लत की सीरत</h3>

        <button onclick="showintro()">परिचय</button>
        <button>जन्म और परिवार</button>
        <button>शिक्षा और प्रशिक्षण</button>
        <button>इल्मी और दीनी सेवाएँ</button>
        <button>अख़लाक़ और किरदार</button>
        <button>विसाल</button>
    `;
}
function showIntro() {
    document.getElementById("newContent").innerHTML = `
        <h2>حافظِ ملت حضرت علامہ شاہ عبدالعزیز محدث مرادآبادی علیہ الرحمہ</h2>

        <h3>हाफ़िज़-ए-मिल्लत का परिचय</h3>

        <p>
        हज़रत अल्लामा शाह अब्दुल अज़ीज़ मुहद्दिस मुरादाबादी
        रहमतुल्लाह अलैह को हाफ़िज़-ए-मिल्लत के नाम से जाना जाता है।
        आपका जन्म 1894 ईस्वी में भोजपुर, ज़िला मुरादाबाद,
        उत्तर प्रदेश में हुआ था।
        </p>

        <p>
        आपने अपने पिता से पवित्र क़ुरआन हिफ़्ज़ किया और
        आगे की दीनी शिक्षा जामिया नईमिया मुरादाबाद तथा
        मदरसा मुईनिया अजमेर शरीफ़ में प्राप्त की।
        आपने अपने शिक्षक सदरुश्शरीआ हज़रत अल्लामा
        अमजद अली आज़मी रहमतुल्लाह अलैह से भी शिक्षा प्राप्त की।
        </p>

        <p>
        14 जनवरी 1934 को आप मुबारकपुर पहुँचे और
        मदरसा अशरफ़िया मिस्बाहुल उलूम की शैक्षणिक
        ज़िम्मेदारी सँभाली। आपकी मेहनत और लगन से
        यह संस्था शिक्षा और ज्ञान का प्रसिद्ध केंद्र बनी।
        </p>

        <p>
        हाफ़िज़-ए-मिल्लत की ज़िंदगी इल्म, दीन की सेवा,
        मेहनत और समर्पण का एक महत्वपूर्ण उदाहरण है।
        </p>
    `;
}
     function showBook() {
    document.getElementById("newContent").innerHTML = `
        <h2>حیاتِ حافظِ ملت</h2>

        <div>
            <button onclick="previousPage()">⬅️ पिछला पन्ना</button>

            <input type="number"
                   id="pageNumber"
                   value="1"
                   min="1"
                   max="474"
                   style="width:70px; padding:10px;">

            <button onclick="goToPage()">जाएँ</button>

            <button onclick="nextPage()">अगला पन्ना ➡️</button>
        </div>

        <p>कुल पन्ने: 474</p>

        <iframe
            id="bookFrame"
            src="./Hayat%20e%20Hafiz%20e%20Millat%20%201.pdf#page=1"
            width="100%"
            height="650">
        </iframe>
    `;
}
    document.getElementById("newContent").innerHTML = `
        <h2>حیاتِ حافظِ ملت</h2>

        <iframe
            src="./Hayat%20e%20Hafiz%20e%20Millat%20%201.pdf"
            width="100%"
            height="650"
            style="border: 2px solid #075e3b; border-radius: 10px;">
        </iframe>
    `;


        function searchBook() {
            document.getElementById("newContent").innerHTML =
                "<h2>کتاب میں تلاش کریں</h2><input type='text' placeholder='لفظ لکھیں'><button>تلاش</button>";
        } let currentPage = 1;

function goToPage() {
    let page = Number(document.getElementById("pageNumber").value);

    if (page < 1 || page > 474 || !Number.isInteger(page)) {
        alert("कृपया 1 से 474 के बीच पेज नंबर डालें।");
        return;
    }

    currentPage = page;
    updateBook();
}

function nextPage() {
    if (currentPage < 474) {
        currentPage++;
        updateBook();
    }
}

function previousPage() {
    if (currentPage > 1) {
        currentPage--;
        updateBook();
    }
}

function updateBook() {
    document.getElementById("pageNumber").value = currentPage;

    document.getElementById("bookFrame").src =
        "./Hayat%20e%20Hafiz%20e%20Millat%20%201.pdf#page=" + currentPage;
}
    </script>
